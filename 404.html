<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found | Aaryan Dhakal</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#2e3440">
    <meta name="color-scheme" content="dark">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="/dist/output.css">
</head>

<body>
    <div class="page-ground flex min-h-screen flex-col">
        <header class="border-b border-line">
            <div class="mx-auto flex max-w-[1120px] items-center px-[18px] py-[14px] md:px-7">
                <a href="/" class="flex items-center gap-[11px] text-ink hover:text-ink">
                    <img src="/images/Logo.png" alt="" width="30" height="30" class="block h-auto w-[30px]">
                    <span class="text-[12px] tracking-[.12em] uppercase xs:text-[14px] xs:tracking-[.16em]">Aaryan
                        Dhakal</span>
                </a>
            </div>
        </header>
        <main class="mx-auto w-full max-w-[1120px] flex-1 px-[18px] py-24 md:px-7">
            <p class="text-[12.5px] tracking-[.1em] text-muted uppercase">Error 404</p>
            <h1 class="mt-3 text-[clamp(34px,7vw,64px)] leading-[.98] tracking-[-.02em] uppercase">
                Page <span class="text-accent">not found</span>
            </h1>
            <div aria-hidden="true" class="my-[30px] h-px w-[180px] bg-linear-to-r from-accent to-transparent"></div>
            <p class="max-w-[56ch] text-[16px] leading-[1.62] text-body md:text-[17.5px]">That page doesn't exist or
                has moved.</p>
            <a href="/"
                class="mt-9 inline-block rounded-lg border border-accent px-[22px] py-[11px] text-[14.5px] text-accent-hi hover:bg-accent/14 hover:text-accent-hi">Back
                to the home page</a>
        </main>
    </div>
</body>

</html>
